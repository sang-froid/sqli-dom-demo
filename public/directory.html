<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrium — Annuaire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <div class="topbar">
        <h1>Annuaire</h1>
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" placeholder="Rechercher un collaborateur…" aria-label="Rechercher un collaborateur">
        </div>
        <div class="right">
          <div class="mode-switch">
            <span class="label">Mode démo</span>
            <button class="toggle" id="mode-toggle" data-on="false"><span class="knob"></span></button>
            <span class="mode-tag vuln" id="mode-tag">Vulnérable</span>
          </div>
          <button class="dev-toggle" id="dev-toggle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            Panneau développeur
          </button>
        </div>
      </div>

      <div class="content">
        <div class="search-form" style="margin-bottom:18px">
          <div class="field">
            <label for="f-dept">Filtrer par service (labo — lecture directe via l'URL)</label>
            <input id="f-dept" placeholder="ex. Ingénierie">
          </div>
          <button class="submit-sm" id="go-dept">Filtrer</button>
          <span class="hint" style="align-self:center">Fonctionne aussi en tapant directement <code>?department=…</code> dans l'adresse.</span>
        </div>
        <div class="grid" id="lab-grid" style="margin-bottom:26px"></div>

        <div class="stat-row" id="stats"></div>
        <div class="grid" id="grid">
          <div class="empty-state">Chargement de l'annuaire…</div>
        </div>
      </div>
    </div>
  </div>

  <div class="dev-panel" id="dev-panel">
    <div class="bar"><span class="led"></span> Console réseau — environnement de démo</div>
    <div class="inner">
      <h4>Requête SQL exécutée côté serveur</h4>
      <pre class="sql" id="dev-sql">—</pre>
      <h4>Réponse brute de l'API</h4>
      <pre id="dev-response">—</pre>
    </div>
  </div>

  <style>
    .search-form{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
    .search-form .field{min-width:220px}
    .submit-sm{background:var(--ink);color:#fff;border:none;border-radius:7px;padding:10px 18px;font-family:var(--font-display);font-weight:700;font-size:.86rem;cursor:pointer}
    .submit-sm:hover{background:var(--ink-2)}
  </style>

  <script src="app-shell.js"></script>
  <script src="lab-guide.js"></script>
  <script>
    const { esc, initials } = AtriumShell;
    AtriumShell.initModeSwitch(document.getElementById('mode-toggle'), document.getElementById('mode-tag'));
    AtriumShell.initDevPanel(document.getElementById('dev-toggle'), document.getElementById('dev-panel'));

    // ---- Lab : filtre par service, lu directement dans l'URL (?department=…), un seul
    // paramètre — pas de formulaire à plusieurs filtres requis pour l'injection UNION.
    const ICON_EMPTY2 = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="7" y1="17" x2="17" y2="7"/></svg>';
    function renderLabResults(rows) {
      const grid = document.getElementById('lab-grid');
      if (!rows || !rows.length) {
        grid.innerHTML = `<div class="empty-state">${ICON_EMPTY2}<div>Aucun résultat pour ce filtre (labo).</div></div>`;
        return;
      }
      grid.innerHTML = rows.map(r => `
        <div class="emp-card" style="cursor:default">
          <div class="avatar">${esc(initials(r.full_name || r.department || '?'))}</div>
          <div>
            <div class="name">${esc(r.full_name)}</div>
            <div class="role">${esc(r.role)}</div>
            <div class="dept">${esc(r.department)}</div>
          </div>
        </div>`).join('');
    }
    async function runDeptFilter() {
      const department = document.getElementById('f-dept').value;
      const url = new URL(location.href);
      if (department) url.searchParams.set('department', department); else url.searchParams.delete('department');
      history.replaceState(null, '', url);
      if (!department) { document.getElementById('lab-grid').innerHTML = ''; return; }
      const mode = AtriumShell.getMode();
      const { data } = await AtriumShell.raw(`/api/lab/directory?department=${encodeURIComponent(department)}&mode=${mode}`);
      document.getElementById('dev-sql').textContent = (data && data.sql_execute) || '—';
      document.getElementById('dev-response').textContent = JSON.stringify(data, null, 2);
      renderLabResults(data && data.resultats);
    }
    document.getElementById('go-dept').addEventListener('click', runDeptFilter);
    document.getElementById('f-dept').addEventListener('keydown', (e) => { if (e.key === 'Enter') runDeptFilter(); });
    document.addEventListener('atrium:mode-change', runDeptFilter);
    {
      const initialDept = new URLSearchParams(location.search).get('department');
      if (initialDept) { document.getElementById('f-dept').value = initialDept; runDeptFilter(); }
    }

    const ICON_EMPTY = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="7" y1="17" x2="17" y2="7"/></svg>';

    const TAGS = ['t-a', 't-b', 't-c'];
    function tagClass(dept) {
      let h = 0;
      for (const c of dept) h = (h * 31 + c.charCodeAt(0)) % 997;
      return TAGS[h % TAGS.length];
    }

    let employees = [];

    function renderStats(user, list) {
      const depts = new Set(list.map(e => e.department)).size;
      const scopeLabel = user.is_admin ? 'Accès complet (administrateur)'
        : user.is_manager ? 'Vous + subordonnés directs' : 'Votre fiche uniquement';
      document.getElementById('stats').innerHTML = `
        <div class="stat-tile hero"><div class="num">${list.length}</div><div class="lbl">Fiches visibles pour votre compte</div></div>
        <div class="stat-tile"><div class="num">${depts}</div><div class="lbl">Service(s) dans votre périmètre</div></div>
        <div class="stat-tile"><div class="num" style="font-size:1.1rem">${scopeLabel}</div><div class="lbl">Portée de votre accès</div></div>
      `;
    }

    function render(list) {
      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = `<div class="empty-state">${ICON_EMPTY}<div>Aucun collaborateur ne correspond à cette recherche.</div></div>`;
        return;
      }
      grid.innerHTML = list.map(emp => `
        <a class="emp-card ${tagClass(emp.department)}" href="profile.html#id=${emp.id}" ${emp.active ? '' : 'style="opacity:.55"'}>
          <div class="avatar">${esc(initials(emp.full_name))}</div>
          <div>
            <div class="name">${esc(emp.full_name)}</div>
            <div class="role">${esc(emp.role)}${emp.active ? '' : ' · désactivé'}</div>
            <div class="dept">${esc(emp.department)}</div>
          </div>
        </a>
      `).join('');
    }

    AtriumShell.boot('directory').then(LabGuide.after('directory', {
      onTry: (a) => { document.getElementById('f-dept').value = a.department; runDeptFilter(); },
    })).then(async () => {
      const data = await AtriumShell.api('/api/employees');
      employees = data.employees;
      renderStats(data.user, employees);
      render(employees);
    }).catch(err => AtriumShell.showError(null, err));

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      render(employees.filter(emp =>
        emp.full_name.toLowerCase().includes(q) ||
        emp.department.toLowerCase().includes(q) ||
        emp.role.toLowerCase().includes(q)
      ));
    });
  </script>
</body>
</html>
