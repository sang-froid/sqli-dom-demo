<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrium — Projet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <div class="topbar">
        <h1 id="title">Projet</h1>
        <div class="right">
          <div class="mode-switch">
            <span class="label">Mode démo</span>
            <button class="toggle" id="mode-toggle" data-on="false"><span class="knob"></span></button>
            <span class="mode-tag vuln" id="mode-tag">Vulnérable</span>
          </div>
          <button class="dev-toggle" id="dev-toggle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            Panneau développeur
          </button>
          <div id="project-actions"></div>
        </div>
      </div>

      <div class="content">
        <div class="breadcrumb"><a href="projects.html">← Projets</a> &nbsp;/&nbsp; projet #<span id="id-display">…</span></div>
        <div id="lab-area"><div class="empty-state">Chargement de l'aperçu (labo)…</div></div>
        <div id="area"><div class="empty-state">Chargement du projet…</div></div>
      </div>
    </div>
  </div>

  <!-- Modifier le projet -->
  <dialog class="dlg" id="edit-dialog">
    <form id="edit-form" method="dialog" novalidate>
      <h3>Modifier le projet</h3>
      <div class="form-grid">
        <div class="field wide"><label for="e-name">Nom</label><input id="e-name" name="name" maxlength="120" required></div>
        <div class="field"><label for="e-client">Client</label><input id="e-client" name="client" maxlength="120" required></div>
        <div class="field"><label for="e-budget">Budget (FCFA)</label><input id="e-budget" name="budget" type="number" min="0" required></div>
        <div class="field"><label for="e-dept">Service</label><select id="e-dept" name="department_id"></select></div>
        <div class="field"><label for="e-status">Statut</label>
          <select id="e-status" name="status"><option>En cours</option><option>Termine</option><option>Suspendu</option></select>
        </div>
      </div>
      <div class="form-error" id="edit-error" role="alert"></div>
      <div class="form-actions">
        <button class="btn primary" type="submit">Enregistrer</button>
        <button class="btn" type="button" data-close>Annuler</button>
      </div>
    </form>
  </dialog>

  <!-- Ajouter un membre -->
  <dialog class="dlg" id="member-dialog">
    <form id="member-form" method="dialog" novalidate>
      <h3>Ajouter un membre</h3>
      <div class="form-grid">
        <div class="field"><label for="m-user">Collaborateur</label><select id="m-user" name="user_id" required></select></div>
        <div class="field"><label for="m-role">Rôle sur le projet</label><input id="m-role" name="role_on_project" maxlength="60" required></div>
      </div>
      <div class="form-error" id="member-error" role="alert"></div>
      <div class="form-actions">
        <button class="btn primary" type="submit">Ajouter</button>
        <button class="btn" type="button" data-close>Annuler</button>
      </div>
    </form>
  </dialog>

  <div class="dev-panel" id="dev-panel">
    <div class="bar"><span class="led"></span> Console réseau — environnement de démo</div>
    <div class="inner">
      <h4>Requête SQL exécutée côté serveur</h4>
      <pre class="sql" id="dev-sql">—</pre>
      <h4>Réponse brute de l'API</h4>
      <pre id="dev-response">—</pre>
    </div>
  </div>

  <!-- Ajouter / modifier un document -->
  <dialog class="dlg" id="doc-dialog">
    <form id="doc-form" method="dialog" novalidate>
      <h3 id="doc-dialog-title">Nouveau document</h3>
      <div class="form-grid">
        <div class="field wide"><label for="d-title">Titre</label><input id="d-title" name="title" maxlength="150" required></div>
        <div class="field wide"><label for="d-content">Contenu</label><textarea id="d-content" name="content" maxlength="5000" required></textarea></div>
        <div class="field check wide">
          <input id="d-conf" name="confidential" type="checkbox">
          <label for="d-conf">Document confidentiel (visible uniquement des membres du projet)</label>
        </div>
      </div>
      <div class="form-error" id="doc-error" role="alert"></div>
      <div class="form-actions">
        <button class="btn primary" type="submit">Enregistrer</button>
        <button class="btn" type="button" data-close>Annuler</button>
      </div>
    </form>
  </dialog>

  <script src="app-shell.js"></script>
  <script src="lab-guide.js"></script>
  <script>
    const { esc, api, fmtDateTime, fmtMoney } = AtriumShell;
    AtriumShell.initModeSwitch(document.getElementById('mode-toggle'), document.getElementById('mode-tag'));
    AtriumShell.initDevPanel(document.getElementById('dev-toggle'), document.getElementById('dev-panel'));

    // L'identifiant du projet vient du fragment d'URL (le DOM), comme sur la fiche
    // collaborateur : `project.html#id=3`. Repli sur `?id=` pour d'anciens liens.
    function resolveRawId() {
      const fromHash = location.hash.replace(/^#id=/, '');
      if (fromHash) return decodeURIComponent(fromHash);
      return new URLSearchParams(location.search).get('id') || '';
    }
    const rawId = resolveRawId();
    const projectId = rawId; // utilisé tel quel par les appels CRUD paramétrés ci-dessous
    let me, state, editingDocId = null;

    const $ = (id) => document.getElementById(id);
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
    $('id-display').textContent = rawId || '(vide)';

    // ---- Aperçu « labo » : appelle /api/lab/project avec l'id brut (non validé), au
    // même titre que profile.html appelle /api/profile. Zone séparée de la vraie fiche
    // projet ci-dessous (#area), qui reste pilotée par les routes paramétrées.
    const ICON_LOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    const ICON_SHIELD = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V6l-8-3Z"/><line x1="9.5" y1="12" x2="14.5" y2="12"/></svg>';
    const ICON_WARN = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 16.5h.01M10.3 3.9 2.6 17.5a1.6 1.6 0 0 0 1.4 2.4h16a1.6 1.6 0 0 0 1.4-2.4L13.7 3.9a1.6 1.6 0 0 0-2.8 0Z"/></svg>';

    function renderLabDenied(message) {
      $('lab-area').innerHTML = `<div class="empty-state warn" style="text-align:left">${ICON_SHIELD}<b>Accès refusé</b><p>${esc(message)}</p></div>`;
    }

    function renderLabProject(rows, documents) {
      const area = $('lab-area');
      if (!rows || !rows.length) {
        area.innerHTML = '<div class="empty-state">Aucun projet trouvé pour cet identifiant.</div>';
        return;
      }
      if (rows.length > 1) {
        area.innerHTML = `
          <div class="empty-state warn" style="text-align:left">
            ${ICON_WARN}
            <b>${rows.length} projets renvoyés pour une seule demande.</b>
            <p>La requête attendait un projet ; elle en a retourné plusieurs — certains hors de votre périmètre.</p>
          </div>
          <div class="projects-list">${rows.map(p => `
            <div class="project-card"><div class="project-head"><div class="project-name">${esc(p.name)}</div></div>
            <div class="project-meta">client : ${esc(p.client)} · budget : ${esc(fmtMoney(p.budget))} · service : ${esc(p.department_name)}</div></div>`).join('')}</div>`;
        return;
      }
      const p = rows[0];
      area.innerHTML = `
        <div class="card" style="margin-bottom:18px">
          <div class="meta-row"><div class="doc-title">Aperçu « labo » — ${esc(p.name)}</div></div>
          <div class="kv" style="margin-top:10px">
            <div><div class="k">Statut</div><div class="v">${esc(p.status)}</div></div>
            <div><div class="k">Client</div><div class="v">${esc(p.client)}</div></div>
            <div><div class="k">Service</div><div class="v">${esc(p.department_name)}</div></div>
            <div><div class="k">Budget</div><div class="v">${esc(fmtMoney(p.budget))}</div></div>
            <div><div class="k">Responsable</div><div class="v">${esc(p.owner_name || '—')}</div></div>
          </div>
          ${(documents || []).length ? `<div class="projects-list" style="margin-top:14px">${documents.map(d => `
            <div class="project-card"><div class="meta-row">
              <div class="doc-title">${esc(d.title)}${d.confidential ? '<span class="conf-badge">Confidentiel</span>' : ''}</div></div>
              <div class="doc-content" style="white-space:pre-wrap">${d.hidden ? ICON_LOCK + ' Contenu masqué — hors de votre périmètre.' : esc(d.content)}</div>
            </div>`).join('')}</div>` : ''}
        </div>`;
    }

    async function loadLab() {
      const mode = AtriumShell.getMode();
      try {
        const { data } = await AtriumShell.raw(`/api/lab/project?id=${encodeURIComponent(rawId)}&mode=${mode}`);
        $('dev-sql').textContent = (data && data.sql_execute) || '—';
        $('dev-response').textContent = JSON.stringify(data, null, 2);
        if (data.error && mode === 'secure' && /refusé/i.test(data.error)) return renderLabDenied(data.error);
        if (data.error && mode === 'secure') { $('lab-area').innerHTML = `<div class="empty-state">${esc(data.error)}</div>`; return; }
        renderLabProject(data.resultats, data.documents);
      } catch (err) {
        $('dev-response').textContent = 'Erreur réseau : ' + err.message;
      }
    }
    document.addEventListener('atrium:mode-change', loadLab);
    window.addEventListener('hashchange', () => location.reload());

    function render() {
      const { project, members, documents, permissions } = state;
      document.title = `Atrium — ${project.name}`;
      $('title').textContent = project.name;

      $('project-actions').innerHTML = permissions.can_manage
        ? '<button class="btn" id="edit-btn">Modifier</button><button class="btn danger" id="delete-btn">Supprimer</button>' : '';
      if (permissions.can_manage) {
        $('edit-btn').addEventListener('click', openEdit);
        $('delete-btn').addEventListener('click', deleteProject);
      }

      $('area').innerHTML = `
        <div class="card">
          <div class="kv">
            <div><div class="k">Statut</div><div class="v"><span class="status-pill ${project.status === 'En cours' ? 'on' : 'off'}">${esc(project.status)}</span></div></div>
            <div><div class="k">Client</div><div class="v">${esc(project.client)}</div></div>
            <div><div class="k">Service</div><div class="v">${esc(project.department_name)}</div></div>
            <div><div class="k">Budget</div><div class="v">${esc(fmtMoney(project.budget))}</div></div>
            <div><div class="k">Responsable</div><div class="v">${esc(project.owner_name || '—')}</div></div>
          </div>
        </div>

        <div class="page-head" style="margin-top:26px"><h3 class="section-title" style="margin:0">Membres (${members.length})</h3>
          ${permissions.can_manage ? '<button class="btn sm" id="add-member">+ Ajouter un membre</button>' : ''}
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Nom</th><th>Service</th><th>Rôle sur le projet</th><th></th></tr></thead>
          <tbody>${members.map(m => `
            <tr>
              <td><b>${esc(m.full_name)}</b>${m.user_id === project.owner_id ? ' <span class="pill amber">responsable</span>' : ''}</td>
              <td>${esc(m.department)}</td>
              <td>${esc(m.role_on_project)}</td>
              <td>${permissions.can_manage && m.user_id !== project.owner_id
                ? `<button class="btn sm danger" data-remove="${m.user_id}">Retirer</button>` : ''}</td>
            </tr>`).join('')}
          </tbody></table></div>

        <div class="page-head" style="margin-top:26px"><h3 class="section-title" style="margin:0">Documents (${documents.length})</h3>
          <button class="btn sm" id="add-doc">+ Nouveau document</button>
        </div>
        ${documents.length ? `<div class="projects-list">${documents.map(d => `
          <div class="project-card">
            <div class="meta-row">
              <div class="doc-title">${esc(d.title)}${d.confidential ? '<span class="conf-badge">Confidentiel</span>' : ''}</div>
              ${d.can_edit ? `<div class="doc-actions">
                <button class="btn sm" data-edit-doc="${d.id}">Modifier</button>
                <button class="btn sm danger" data-del-doc="${d.id}">Supprimer</button></div>` : ''}
            </div>
            <div class="doc-content" style="white-space:pre-wrap">${esc(d.content)}</div>
            <div class="project-meta">${esc(d.author_name || 'auteur inconnu')} · ${esc(fmtDateTime(d.updated_at || d.created_at))}</div>
          </div>`).join('')}</div>`
          : '<div class="empty-state" style="padding:26px">Aucun document pour ce projet.</div>'}`;

      if (permissions.can_manage) $('add-member').addEventListener('click', openMember);
      $('add-doc').addEventListener('click', () => openDoc(null));
      document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => removeMember(Number(b.dataset.remove))));
      document.querySelectorAll('[data-edit-doc]').forEach(b => b.addEventListener('click', () => openDoc(Number(b.dataset.editDoc))));
      document.querySelectorAll('[data-del-doc]').forEach(b => b.addEventListener('click', () => deleteDoc(Number(b.dataset.delDoc))));
    }

    async function load() {
      state = await api(`/api/projects/${encodeURIComponent(projectId)}`);
      render();
    }

    // Soumission générique : appelle l'API, ferme le dialogue, recharge la page de données.
    function bindForm(form, errorId, dialogId, action) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        AtriumShell.clearError($(errorId));
        try {
          await action();
          $(dialogId).close();
          await load();
        } catch (err) { AtriumShell.showError($(errorId), err); }
      });
    }

    // ---- projet
    async function openEdit() {
      const f = $('edit-form');
      const p = state.project;
      AtriumShell.clearError($('edit-error'));
      const depts = await api('/api/departments');
      $('e-dept').innerHTML = depts.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
      f.name.value = p.name; f.client.value = p.client; f.budget.value = p.budget;
      f.department_id.value = p.department_id; f.status.value = p.status;
      $('edit-dialog').showModal();
    }
    bindForm($('edit-form'), 'edit-error', 'edit-dialog', () => {
      const f = $('edit-form');
      return api(`/api/projects/${projectId}`, {
        method: 'PATCH',
        body: { name: f.name.value, client: f.client.value, budget: Number(f.budget.value),
                status: f.status.value, department_id: Number(f.department_id.value) },
      });
    });

    async function deleteProject() {
      if (!confirm(`Supprimer définitivement « ${state.project.name} », ses membres et ses documents ?`)) return;
      try { await api(`/api/projects/${projectId}`, { method: 'DELETE' }); location.href = 'projects.html'; }
      catch (err) { AtriumShell.showError(null, err); }
    }

    // ---- membres
    async function openMember() {
      AtriumShell.clearError($('member-error'));
      $('member-form').reset();
      const candidates = await api(`/api/projects/${projectId}/candidates`);
      $('m-user').innerHTML = candidates.length
        ? candidates.map(c => `<option value="${c.id}">${esc(c.full_name)} — ${esc(c.department)}</option>`).join('')
        : '<option value="">Aucun collaborateur disponible</option>';
      $('member-dialog').showModal();
    }
    bindForm($('member-form'), 'member-error', 'member-dialog', () => {
      const f = $('member-form');
      return api(`/api/projects/${projectId}/members`, {
        method: 'POST', body: { user_id: Number(f.user_id.value), role_on_project: f.role_on_project.value },
      });
    });

    async function removeMember(userId) {
      if (!confirm('Retirer ce membre du projet ?')) return;
      try { await api(`/api/projects/${projectId}/members/${userId}`, { method: 'DELETE' }); await load(); }
      catch (err) { AtriumShell.showError(null, err); }
    }

    // ---- documents
    function openDoc(docId) {
      const f = $('doc-form');
      AtriumShell.clearError($('doc-error'));
      f.reset();
      editingDocId = docId;
      $('doc-dialog-title').textContent = docId ? 'Modifier le document' : 'Nouveau document';
      if (docId) {
        const d = state.documents.find(x => x.id === docId);
        f.title.value = d.title; f.content.value = d.content; f.confidential.checked = d.confidential;
      }
      $('doc-dialog').showModal();
    }
    bindForm($('doc-form'), 'doc-error', 'doc-dialog', () => {
      const f = $('doc-form');
      const body = { title: f.title.value, content: f.content.value, confidential: f.confidential.checked };
      return editingDocId
        ? api(`/api/documents/${editingDocId}`, { method: 'PATCH', body })
        : api(`/api/projects/${projectId}/documents`, { method: 'POST', body });
    });

    async function deleteDoc(id) {
      if (!confirm('Supprimer ce document ?')) return;
      try { await api(`/api/documents/${id}`, { method: 'DELETE' }); await load(); }
      catch (err) { AtriumShell.showError(null, err); }
    }

    AtriumShell.boot('projects')
      .then(LabGuide.after('project', {
        onTry: (a) => {
          const target = '#id=' + encodeURIComponent(a.id);
          if (location.hash === target) loadLab(); else location.hash = target;
        },
      }))
      .then(async (user) => { me = user; await loadLab(); await load(); })
      .catch(err => {
        $('area').innerHTML = `<div class="empty-state warn"><b>${esc(err.message)}</b></div>`;
      });
  </script>
</body>
</html>
