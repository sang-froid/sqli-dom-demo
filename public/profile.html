<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrium — Fiche collaborateur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <div class="topbar">
        <h1>Fiche collaborateur</h1>
        <div class="right">
          <div class="mode-switch">
            <span class="label">Mode démo</span>
            <button class="toggle" id="mode-toggle" data-on="false"><span class="knob"></span></button>
            <span class="mode-tag vuln" id="mode-tag">Vulnérable</span>
          </div>
          <button class="dev-toggle" id="dev-toggle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            Panneau développeur
          </button>
        </div>
      </div>

      <div class="content">
        <div class="breadcrumb"><a href="directory.html">← Annuaire</a> &nbsp;/&nbsp; fiche #<span id="id-display">…</span></div>

        <div id="profile-area">
          <div class="empty-state">Chargement de la fiche…</div>
        </div>
      </div>
    </div>
  </div>

  <div class="dev-panel" id="dev-panel">
    <div class="bar"><span class="led"></span> Console réseau — environnement de démo</div>
    <div class="inner">
      <h4>Requête SQL exécutée côté serveur</h4>
      <pre class="sql" id="dev-sql">—</pre>
      <h4>Réponse brute de l'API</h4>
      <pre id="dev-response">—</pre>
    </div>
  </div>

  <script src="app-shell.js"></script>
  <script>
    const { esc, initials, fmtDate } = AtriumShell;
    AtriumShell.initModeSwitch(document.getElementById('mode-toggle'), document.getElementById('mode-tag'));
    AtriumShell.initDevPanel(document.getElementById('dev-toggle'), document.getElementById('dev-panel'));

    const ICON_EMPTY = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="7" y1="17" x2="17" y2="7"/></svg>';
    const ICON_INFO = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="10.5" x2="12" y2="16"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/></svg>';
    const ICON_WARN = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 16.5h.01M10.3 3.9 2.6 17.5a1.6 1.6 0 0 0 1.4 2.4h16a1.6 1.6 0 0 0 1.4-2.4L13.7 3.9a1.6 1.6 0 0 0-2.8 0Z"/></svg>';
    const ICON_LOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    const ICON_SHIELD = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V6l-8-3Z"/><line x1="9.5" y1="12" x2="14.5" y2="12"/></svg>';
    const ICON_FOLDER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>';

    function renderProjects(projects) {
      if (!projects || !projects.length) {
        return `<div class="empty-state" style="padding:26px"><div style="font-size:.86rem">Aucun projet associé à cette fiche.</div></div>`;
      }
      return `
        <div class="projects-list">
          ${projects.map(p => `
            <div class="project-card">
              <div class="project-head">
                <div class="project-name">${ICON_FOLDER}${esc(p.name)}</div>
                <span class="status-pill ${p.status === 'En cours' ? 'on' : 'off'}">${esc(p.status)}</span>
              </div>
              <div class="project-meta">${esc(p.role_on_project)} · client : ${esc(p.client)} · service : ${esc(p.department_name)}</div>
              ${(p.documents || []).map(d => `
                <div class="doc-row ${d.hidden ? 'doc-hidden' : ''}">
                  ${d.hidden ? ICON_LOCK : ICON_FOLDER}
                  <div>
                    <div class="doc-title">${esc(d.title)}${d.confidential ? '<span class="conf-badge">Confidentiel</span>' : ''}</div>
                    <div class="doc-content">${d.hidden ? 'Contenu masqué — hors de votre périmètre (document confidentiel d\'un projet dont vous n\'êtes pas membre).' : esc(d.content)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>`;
    }

    function renderProfile(rows, projects) {
      const area = document.getElementById('profile-area');
      if (!rows || !rows.length) {
        area.innerHTML = `<div class="empty-state">${ICON_EMPTY}<div>Aucun collaborateur trouvé pour cet identifiant.</div></div>`;
        return;
      }
      if (rows.length === 1) {
        const e = rows[0];
        const isAdmin = /admin/i.test(e.role);
        area.innerHTML = `
          <div class="profile-head">
            <div class="id-chip">#${esc(String(e.id).padStart(4, '0'))}</div>
            <div class="row">
              <div class="avatar-lg">${esc(initials(e.full_name))}</div>
              <div>
                <h2>${esc(e.full_name)}</h2>
                <div class="sub">
                  <span class="role-pill ${isAdmin ? 'admin' : ''}">${esc(e.role)}</span>
                  <span>${esc(e.department)}</span>
                  <span>·</span>
                  <span>${esc(e.site || '—')}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="info-grid">
            <div class="info-cell"><div class="k">Nom d'utilisateur</div><div class="v">${esc(e.username)}</div></div>
            <div class="info-cell"><div class="k">E-mail</div><div class="v">${esc(e.email)}</div></div>
            <div class="info-cell"><div class="k">Téléphone</div><div class="v">${esc(e.phone || '—')}</div></div>
            <div class="info-cell"><div class="k">Arrivée</div><div class="v">${esc(fmtDate(e.hire_date))}</div></div>
            <div class="info-cell"><div class="k">Manager</div><div class="v">${esc(e.manager_name || '— (aucun)')}</div></div>
            <div class="info-cell"><div class="k">Bio</div><div class="v" style="font-weight:500;font-size:.88rem">${esc(e.bio || '—')}</div></div>
            <div class="info-cell sensitive">
              ${ICON_LOCK}
              <div>
                <div class="k">Mot de passe (haché bcrypt) — issu de la requête</div>
                <div class="v">${esc(e.password)}</div>
              </div>
            </div>
          </div>
          <h3 class="section-title">Projets</h3>
          ${renderProjects(projects)}`;
        return;
      }
      // Plus d'une ligne renvoyée pour "une" fiche : c'est le symptôme à montrer en soutenance.
      area.innerHTML = `
        <div class="empty-state warn" style="text-align:left">
          ${ICON_WARN}
          <b>${rows.length} fiches renvoyées pour une seule demande.</b>
          <p>La requête attendait un collaborateur ; elle en a retourné plusieurs — et certaines sortent de votre
          périmètre d'autorisation. Le filtre qui devait limiter l'accès a été contourné par la requête envoyée.</p>
        </div>
        <div class="grid" style="margin-top:14px">
          ${rows.map(e => `
            <div class="emp-card" style="cursor:default">
              <div class="avatar">${esc(initials(e.full_name))}</div>
              <div>
                <div class="name">${esc(e.full_name)}</div>
                <div class="role">${esc(e.role)}</div>
                <div class="dept">${esc(e.department)} · hash : ${esc(String(e.password).slice(0, 18))}…</div>
              </div>
            </div>`).join('')}
        </div>`;
    }

    function renderDenied(message) {
      document.getElementById('profile-area').innerHTML = `
        <div class="empty-state warn" style="text-align:left">
          ${ICON_SHIELD}
          <b>Accès refusé</b>
          <p>${esc(message)}</p>
        </div>`;
    }

    async function load() {
      // 1) SOURCE : la valeur est lue dans le DOM (le fragment d'URL), sans validation.
      const raw = decodeURIComponent(location.hash.replace(/^#id=/, ''));
      document.getElementById('id-display').textContent = raw || '(vide)';

      const mode = AtriumShell.getMode();

      // 2) TRANSIT : transmission telle quelle à l'API, avec le mode choisi dans l'UI
      //    (la session voyage dans le cookie). raw() : on veut aussi le corps des erreurs
      //    (SQL ou 403) pour le panneau développeur.
      try {
        const { data } = await AtriumShell.raw(`/api/profile?id=${encodeURIComponent(raw)}&mode=${mode}`);
        document.getElementById('dev-sql').textContent = data.sql_execute || '—';
        document.getElementById('dev-response').textContent = JSON.stringify(data, null, 2);

        if (data.error && mode === 'secure' && /refusé/i.test(data.error)) {
          renderDenied(data.error);
          return;
        }
        if (data.error && mode === 'secure') {
          document.getElementById('profile-area').innerHTML = `<div class="empty-state">${ICON_INFO}<div>${esc(data.error)}</div></div>`;
          return;
        }
        renderProfile(data.resultats, data.projects);
      } catch (err) {
        document.getElementById('dev-response').textContent = 'Erreur réseau : ' + err.message;
      }
    }

    document.addEventListener('atrium:mode-change', load);
    window.addEventListener('hashchange', load);
    AtriumShell.boot('directory').then(load);
  </script>
</body>
</html>
