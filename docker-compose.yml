version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: sqli_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shop_vulnerable
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  app:
    build: ./server
    container_name: sqli_app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: rootpass
      DB_NAME: shop_vulnerable
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - ./public:/app/public
      - ./logs:/app/logs
    command: node server.js

volumes:
  mysql_data: